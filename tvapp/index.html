    <!-- Emergency Service Worker Recovery Script for Legacy Browsers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.update();
          }
        });
      }
    </script>

  <body class="bg-rba-grayBg text-slate-800 antialiased selection:bg-rba-blue selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('PWA ServiceWorker registered:', reg.scope);
            // Check for service worker updates on page load
            if (reg.update) reg.update();
          }).catch(function(err) {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
